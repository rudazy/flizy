<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privy owner spike</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0a0a0a; color: #f5f5f5; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font: 600 18px/1.3 system-ui, sans-serif; letter-spacing: 0.02em; margin: 0 0 4px; }
      .muted { color: #8a8a8a; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid #1f1f1f; }
      .id { width: 32px; color: #8a8a8a; }
      .what { flex: 1 1 320px; }
      .status { width: 64px; }
      .PASS { color: #f5c842; }
      .FAIL { color: #ff6b5b; }
      button { background: #141414; color: #f5f5f5; border: 1px solid #333; border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer; min-height: 36px; }
      button:hover:not(:disabled) { border-color: #f5c842; }
      button:disabled { opacity: 0.4; cursor: default; }
      pre { background: #111111; padding: 12px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
